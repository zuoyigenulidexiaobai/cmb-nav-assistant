# 招行理财净值助手 —— nginx 前置反向代理
#
# 部署位置：/www/server/panel/vhost/nginx/cmb-nav.conf
# 该目录已被 /www/server/nginx/conf/nginx.conf 末尾的
#         include /www/server/panel/vhost/nginx/*.conf;
# 自动加载，因此不需要改动 nginx.conf。
#
# 架构：浏览器 → nginx(80/443) → 127.0.0.1:9001(Node，只监听回环)
# 生效：nginx -t && nginx -s reload   （或 systemctl reload nginx / service nginx reload）

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # 导入 seed-data.json 等批量数据时的请求体上限（nginx.conf 全局已设 50m，此处显式声明以便单独调整）
    client_max_body_size 50m;

    # 全量抓取活跃产品约 10s；批量导入可能更久，读超时放宽到 5 分钟
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # 后端返回的 JS/CSS 也要走 gzip（全局 gzip_proxied 规则较保守，这里放开）
    gzip_proxied any;

    access_log /www/wwwlogs/cmb-nav.access.log;
    error_log  /www/wwwlogs/cmb-nav.error.log;

    location / {
        proxy_pass         http://127.0.0.1:9001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # 关键：由 nginx 用真实对端地址覆写，客户端自带的同名头会被丢弃，
        # 后端 TRUST_PROXY=1 时以此做登录节流，无法伪造。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }
}

