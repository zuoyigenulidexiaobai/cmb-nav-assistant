<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>净值走势页示意图</title>
  <desc>展示三只产品的近三个月净值叠加折线图，图例可点选，区间可切换，配色遵循国内习惯涨红跌绿。数据为虚构示例。</desc>

  <rect x="8" y="8" width="704" height="454" rx="12" fill="#ffffff" stroke="#d8dce3"/>

  <text x="28" y="40" font-size="14" font-weight="500" fill="#1f2329">净值走势</text>
  <text x="28" y="60" font-size="11.5" fill="#8a9099">多产品叠加对比 · 区间内上涨为红、下跌为绿</text>

  <rect x="384" y="26" width="60" height="24" rx="6" fill="#f5f7fa" stroke="#e3e6eb"/>
  <text x="414" y="42" font-size="11" fill="#5f6773" text-anchor="middle">1 月</text>
  <rect x="450" y="26" width="60" height="24" rx="6" fill="#ffffff" stroke="#e3e6eb"/>
  <text x="480" y="42" font-size="11" fill="#5f6773" text-anchor="middle">3 月</text>
  <rect x="516" y="26" width="60" height="24" rx="6" fill="#ffffff" stroke="#e3e6eb"/>
  <text x="546" y="42" font-size="11" fill="#5f6773" text-anchor="middle">6 月</text>
  <rect x="582" y="26" width="98" height="24" rx="6" fill="#2f6bff"/>
  <text x="631" y="42" font-size="11" fill="#ffffff" text-anchor="middle">全部</text>

  <line x1="90" y1="96" x2="684" y2="96" stroke="#eef0f3"/>
  <line x1="90" y1="140" x2="684" y2="140" stroke="#eef0f3"/>
  <line x1="90" y1="184" x2="684" y2="184" stroke="#eef0f3"/>
  <line x1="90" y1="228" x2="684" y2="228" stroke="#eef0f3"/>
  <line x1="90" y1="272" x2="684" y2="272" stroke="#eef0f3"/>
  <line x1="90" y1="316" x2="684" y2="316" stroke="#eef0f3"/>

  <text x="78" y="100" font-size="10.5" fill="#a9afb8" text-anchor="end">1.05</text>
  <text x="78" y="144" font-size="10.5" fill="#a9afb8" text-anchor="end">1.04</text>
  <text x="78" y="188" font-size="10.5" fill="#a9afb8" text-anchor="end">1.03</text>
  <text x="78" y="232" font-size="10.5" fill="#a9afb8" text-anchor="end">1.02</text>
  <text x="78" y="276" font-size="10.5" fill="#a9afb8" text-anchor="end">1.01</text>
  <text x="78" y="320" font-size="10.5" fill="#a9afb8" text-anchor="end">1.00</text>

  <polyline points="90,300 158,296 226,286 294,282 362,266 430,258 498,248 566,236 634,224 684,216"
    fill="none" stroke="#d4382c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="90,292 158,290 226,288 294,290 362,292 430,294 498,298 566,302 634,306 684,310"
    fill="none" stroke="#1f8a5b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="90,306 158,300 226,298 294,292 362,288 430,282 498,278 566,274 634,268 684,262"
    fill="none" stroke="#2f6bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="684" cy="216" r="3.5" fill="#d4382c"/>
  <circle cx="684" cy="310" r="3.5" fill="#1f8a5b"/>
  <circle cx="684" cy="262" r="3.5" fill="#2f6bff"/>

  <line x1="90" y1="340" x2="684" y2="340" stroke="#d8dce3"/>
  <text x="90" y="358" font-size="10.5" fill="#a9afb8" text-anchor="middle">07-20</text>
  <text x="238" y="358" font-size="10.5" fill="#a9afb8" text-anchor="middle">08-10</text>
  <text x="386" y="358" font-size="10.5" fill="#a9afb8" text-anchor="middle">08-31</text>
  <text x="534" y="358" font-size="10.5" fill="#a9afb8" text-anchor="middle">09-21</text>
  <text x="684" y="358" font-size="10.5" fill="#a9afb8" text-anchor="middle">10-12</text>

  <g>
    <rect x="90" y="378" width="594" height="1" fill="#eef0f3"/>
    <circle cx="104" cy="400" r="4" fill="#d4382c"/>
    <text x="116" y="404" font-size="11.5" fill="#5f6773">某某理财 30 天</text>
    <circle cx="262" cy="400" r="4" fill="#1f8a5b"/>
    <text x="274" y="404" font-size="11.5" fill="#5f6773">某某理财 7 天</text>
    <circle cx="420" cy="400" r="4" fill="#2f6bff"/>
    <text x="432" y="404" font-size="11.5" fill="#5f6773">某某理财 90 天</text>
    <text x="684" y="404" font-size="11" fill="#a9afb8" text-anchor="end">点击图例可隐藏 / 显示</text>
  </g>

  <rect x="90" y="418" width="594" height="34" rx="8" fill="#f5f7fa"/>
  <text x="106" y="440" font-size="11" fill="#5f6773">区间年化</text>
  <text x="196" y="440" font-size="11" fill="#8a9099">30 天</text>
  <text x="212" y="440" font-size="11.5" font-weight="500" fill="#c3271c">+2.04%</text>
  <text x="300" y="440" font-size="11" fill="#8a9099">7 天</text>
  <text x="316" y="440" font-size="11.5" font-weight="500" fill="#1a7f4b">−1.05%</text>
  <text x="404" y="440" font-size="11" fill="#8a9099">90 天</text>
  <text x="420" y="440" font-size="11.5" font-weight="500" fill="#c3271c">+2.61%</text>
  <text x="684" y="440" font-size="11" fill="#a9afb8" text-anchor="end">基准点取最近不超过目标日的净值</text>
</svg>
